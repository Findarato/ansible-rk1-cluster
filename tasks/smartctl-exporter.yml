- name: 'Deploy smartctl-exporter'
  community.docker.docker_container:
    name: 'smartctl-exporter'
    image: "prometheuscommunity/smartctl-exporter:{{ smartctl_exporter_release }}"
    state: 'started'
    restart_policy: 'unless-stopped'
    # Swarm services are not granted privileged access, so the exporter runs
    # as a plain container. smartctl needs raw device access to query SMART.
    privileged: true
    user: 'root'
    # Host networking puts the exporter on each node's LAN address, where
    # Prometheus scrapes it on port 9633.
    network_mode: 'host'
    env:
      TZ: 'America/Chicago'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    log_driver: 'json-file'
    log_options:
      max-size: '10m'
      max-file: '3'
  tags:
    - prometheus
    - smartctl
