- name: 'Create network'
  community.docker.docker_network:
    name: 'prometheus_backend'
    driver: 'overlay'
  tags:
    - prometheus

- name: 'Create directory for container data'
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ dir }}"
    owner: '{{ docker_user }}'
    group: '{{ docker_group }}'
    mode: '0777'
    state: 'directory'
  loop:
    - 'prometheus-data'
    - 'prometheus-config'
  loop_control:
    loop_var: 'dir'
  tags:
    - prometheus

- name: 'Remove prometheus'
  community.docker.docker_swarm_service:
    name: 'prometheus'
    state: absent
    replicas: 0
  tags:
    - prometheus
    - stop_all_services

- name: Copy configuration file
  ansible.builtin.template:
    src: prometheus/prometheus.yml.j2
    dest: "{{ docker_data_dir }}/prometheus-config/prometheus.yml"
    mode: '0644'
    owner: '{{ docker_user }}'
    group: '{{ docker_group }}'
  tags:
    - prometheus

- name: 'Deploy prometheus'
  community.docker.docker_swarm_service:
    name: 'prometheus'
    image: "quay.io/prometheus/prometheus:{{ prometheus_release }}"
    hostname: prometheus
    # The image runs as nobody, but cAdvisor discovery needs to read the
    # root-owned Docker socket (root:docker 0660) mounted below.
    user: 'root'
    force_update: true
    env:
      - "TZ=America/Chicago"
    mounts:
      - source: "{{ docker_data_dir }}/prometheus-data/"
        target: '/prometheus'
        type: 'bind'
      - source: "{{ docker_data_dir }}/prometheus-config/prometheus.yml"
        target: '/etc/prometheus/prometheus.yml'
        readonly: true
        type: 'bind'
      - source: '/var/run/docker.sock'
        target: '/var/run/docker.sock'
        readonly: true
        type: 'bind'
      - source: '/etc/localtime'
        target: '/etc/localtime'
        type: 'bind'
        readonly: true
      - target: '/tmp'
        type: 'tmpfs'
    networks:
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`{{ prometheus_app_name }}.{{ traefik_domain_rk1 }}`)
      traefik.http.routers.prometheus.tls: "true"
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    mode: 'replicated'
    replicas: 1
    restart_config:
      condition: "{{ restart_condition }}"
    placement:
      constraints:
        - 'node.platform.os == linux'
        - 'node.labels.bigmem == true'
  no_log: "{{ not docker_service_debug }}"
  tags:
    - prometheus

- name: 'Deploy cadvisor'
  community.docker.docker_swarm_service:
    name: 'cadvisor'
    image: "ghcr.io/google/cadvisor:{{ cadvisor_release }}"
    hostname: cadvisor
    args:
      - '-docker_only'
    force_update: true
    env:
      - "TZ=America/Chicago"
    mounts:
      - source: '/var/run/docker.sock'
        target: '/var/run/docker.sock'
        type: 'bind'
        readonly: true
      - source: '/'
        target: '/rootfs'
        type: 'bind'
        readonly: true
      - source: '/var/run'
        target: '/var/run'
        type: 'bind'
        readonly: true
      - source: '/sys'
        target: '/sys'
        type: 'bind'
        readonly: true
      - source: '/var/lib/docker'
        target: '/var/lib/docker'
        type: 'bind'
        readonly: true
      - source: '/etc/localtime'
        target: '/etc/localtime'
        type: 'bind'
        readonly: true
      - target: '/tmp'
        type: 'tmpfs'
    networks:
      - traefik_proxy
    mode: 'global'
    restart_config:
      condition: "{{ restart_condition }}"
    placement:
      constraints:
        - 'node.platform.os == linux'
  no_log: "{{ not docker_service_debug }}"
  tags:
    - prometheus


# smartctl-exporter runs as a standalone privileged container on every node
# (tasks/smartctl-exporter.yml) because a Swarm service cannot be granted the
# device access smartctl needs. Remove the old Swarm service if it exists.
- name: 'Remove smartctl-exporter Swarm service'
  community.docker.docker_swarm_service:
    name: 'smartctl-exporter'
    state: absent
  tags:
    - prometheus
    - smartctl
