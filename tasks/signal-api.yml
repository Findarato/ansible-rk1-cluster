---
- name: 'Create network'
  community.docker.docker_network:
    name: 'signal_backend'
    driver: 'overlay'
    state: absent
  tags:
    - pihole

- name: 'Create directory for container data'
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ dir }}"
    owner: 'ubuntu'
    group: 'ubuntu'
    mode: '0755'
    state: 'directory'
  loop:
    - 'signal-config'
  loop_control:
    loop_var: 'dir'
  tags:
    - signal

- name: 'Remove signal'
  community.docker.docker_swarm_service:
    name: 'signal'
    state: absent
    replicas: 0
  tags:
    - signal


- name: 'Deploy signal'
  community.docker.docker_swarm_service:
    name: 'signal'
    image: "bbernhard/signal-cli-rest-api:{{ signal_cli_release }}"
    env:
      - "MODE=native"
    mounts:
      - source: "{{ docker_data_dir }}/signal-config"
        target: '/home/.local/share/signal-cli'
        type: 'bind'
      - source: "/etc/localtime"
        target: '/etc/localtime'
        type: 'bind'
    networks:
      - "{{ traefik_proxy_network }}"
    # dns: "{{ dns_servers }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.signal.rule: Host(`{{ signal_app_name }}.{{ traefik_domain_rk1 }}`)
      traefik.http.routers.signal.tls: "true"
      traefik.http.routers.signal.entrypoints: websecure
      traefik.http.services.signal.loadbalancer.server.port: 8080

    mode: 'replicated'
    replicas: 2
    restart_config:
      condition: "{{ restart_condition }}"
  no_log: "{{ not docker_service_debug }}"
  tags:
    - signal

