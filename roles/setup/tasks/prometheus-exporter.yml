- name: install prometheus node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: yes
  tags: [setup, prometheus]


- name: ensure prometheus node exporter is running
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: yes
  tags: [setup, prometheus]